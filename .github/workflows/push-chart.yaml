name: Build & Push Updated Charts (PROD)
on:
  push:
    branches:
      - main
    paths:
      - "charts/**"

permissions:
  contents: write

concurrency:
  group: push-charts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  get-modified-charts:
    runs-on: ubuntu-4
    outputs:
      paths: ${{ steps.get-modified-charts.outputs.paths }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Get modified charts
        id: get-modified-charts
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -f
          charts=()
          while IFS= read -r -d '' file; do
            [[ "$file" == charts/*/* ]] || continue
            IFS=/ read -r _ name _ <<< "$file"
            if [[ ! "$name" =~ ^[a-zA-Z0-9._-]+$ ]]; then
              echo "::error::Refusing to process chart directory with unexpected characters: ${file}"
              exit 1
            fi
            charts+=("charts/${name}")
          done < <(git diff --name-only -z "$BEFORE_SHA" "$AFTER_SHA")

          paths=""
          if [[ ${#charts[@]} -gt 0 ]]; then
            paths=$(printf '%s\n' "${charts[@]}" | sort -u | tr '\n' ' ' | sed 's/ *$//')
          fi

          echo "Modified charts: ${paths}"
          echo "paths=${paths}" >> "$GITHUB_OUTPUT"

  push-charts:
    needs: get-modified-charts
    runs-on: ubuntu-4
    if: ${{ needs.get-modified-charts.outputs.paths != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Create and push git tags
      - name: Create and push git tags
        env:
          MODIFIED_PATHS: ${{ needs.get-modified-charts.outputs.paths }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          IFS=' ' read -ra ADDR <<< "$MODIFIED_PATHS"
          for path in "${ADDR[@]}"; do
            chart_name=$(basename "$path")

            # Anchored so an indented dependency version can never win
            version=$(grep -m1 '^version:' "${path}/Chart.yaml" | awk '{print $2}')
            if [[ -z "$version" ]]; then
              echo "::error::Could not determine chart version from ${path}/Chart.yaml"
              exit 1
            fi

            tag="${chart_name}-${version}"

            # Delete existing tag if exists
            git tag -d "$tag" || true
            git push origin ":refs/tags/$tag" || true

            # Create and push new tag
            git tag "$tag"
            git push origin "$tag"
          done

      - uses: a-thomas-22/helm-push-action@780d6973e12f5dd24dcd6f4a2975f14d87c62699 # v0.0.29
        env:
          PATHS: ${{ needs.get-modified-charts.outputs.paths }}
          FORCE: "True"
          CHARTMUSEUM_URL: "chartmuseum-external.iue1v1-0.i.arbitrum-internal.io/public"
          CHARTMUSEUM_ALIAS: "chartmuseum.offchainlabs.internal"
          CHARTMUSEUM_CA_CERT: "${{ secrets.CHARTMUSEUM_CA_CERT }}"
          CHARTMUSEUM_KEY: "${{ secrets.CHARTMUSEUM_KEY }}"
          CHARTMUSEUM_CERT: "${{ secrets.CHARTMUSEUM_CERT }}"
