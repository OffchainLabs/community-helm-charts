name: 'Update README (Privileged)'

on:
  workflow_run:
    workflows: ["Check README Updates (Unprivileged)"]
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: write
  checks: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'

    steps:
      - name: Resolve pull request
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${run.head_repository.owner.login}:${run.head_branch}`,
              per_page: 100,
            });

            const pr = prs.find(p => p.head.sha === run.head_sha);
            if (!pr) {
              core.info('No open pull request matches this run; nothing to do.');
              core.setOutput('found', 'false');
              return;
            }

            if (!/^[A-Za-z0-9._\/-]+$/.test(pr.head.ref)) {
              core.setFailed('Unexpected characters in pull request branch name.');
              return;
            }

            core.setOutput('found', 'true');
            core.setOutput('number', String(pr.number));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('branch', pr.head.ref);
            core.setOutput('is_fork', String(pr.head.repo.full_name !== `${owner}/${repo}`));

      - name: Download check results
        if: steps.pr.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: pr-readme-info
          path: pr-info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate check results
        if: steps.pr.outputs.found == 'true'
        id: results
        env:
          IS_FORK: ${{ steps.pr.outputs.is_fork }}
        run: |
          set -f

          read_flag() {
            local name=$1 value
            value=$(tr -d '\r\n' < "pr-info/${name}")
            case "$value" in
              true|false) ;;
              *) echo "::error::Unexpected value for ${name} in check results"; exit 1 ;;
            esac
            printf -v "$name" '%s' "$value"
          }

          read_flag HAS_CHANGES
          read_flag CHANGES_NEEDED

          charts=$(tr -d '\r\n' < pr-info/MODIFIED_CHARTS)
          details=$(tr -d '\r\n' < pr-info/CHANGES_DETAILS)

          for chart in $charts; do
            if [[ ! "$chart" =~ ^charts/[a-zA-Z0-9._-]+$ ]]; then
              echo "::error::Unexpected chart path in check results"
              exit 1
            fi
          done

          IFS=',' read -ra entries <<< "$details"
          for entry in "${entries[@]}"; do
            [[ -z "$entry" ]] && continue
            if [[ ! "$entry" =~ ^charts/[a-zA-Z0-9._-]+:(no_changes|needs_update)$ ]]; then
              echo "::error::Unexpected entry in check results"
              exit 1
            fi
          done

          should_update=false
          should_comment=false
          if [[ "$HAS_CHANGES" == "true" && "$CHANGES_NEEDED" == "true" && "$IS_FORK" == "false" ]]; then
            should_update=true
          fi
          if [[ "$HAS_CHANGES" == "true" && "$IS_FORK" == "true" ]]; then
            should_comment=true
          fi

          {
            echo "has_changes=${HAS_CHANGES}"
            echo "changes_needed=${CHANGES_NEEDED}"
            echo "charts=${charts}"
            echo "details=${details}"
            echo "should_update=${should_update}"
            echo "should_comment=${should_comment}"
          } >> "$GITHUB_OUTPUT"

      - name: Install readme-generator-for-helm
        if: steps.results.outputs.should_update == 'true'
        run: npm install -g @bitnami/readme-generator-for-helm

      - name: Checkout pull request branch
        if: steps.results.outputs.should_update == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0

      - name: Regenerate chart READMEs
        if: steps.results.outputs.should_update == 'true'
        env:
          MODIFIED_CHARTS: ${{ steps.results.outputs.charts }}
        run: |
          IFS=' ' read -ra ADDR <<< "$MODIFIED_CHARTS"
          echo "Updating READMEs for modified charts: ${ADDR[*]}"
          for chart in "${ADDR[@]}"; do
            echo "Updating README.md for ${chart}"
            readme-generator --values "${chart}/values.yaml" --readme "${chart}/README.md"
          done

      - name: Commit and push README updates
        if: steps.results.outputs.should_update == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update README for modified charts
          branch: ${{ steps.pr.outputs.branch }}

      - name: Prepare comment content
        if: steps.results.outputs.should_comment == 'true'
        env:
          CHANGES_NEEDED: ${{ steps.results.outputs.changes_needed }}
          CHANGES_DETAILS: ${{ steps.results.outputs.details }}
          MODIFIED_CHARTS: ${{ steps.results.outputs.charts }}
        run: |
          if [[ "$CHANGES_NEEDED" == "true" ]]; then
            {
              echo "## README Update Required"
              echo ""
              echo "This PR is from a fork. The README generator has detected changes that need to be made to the README files."
              echo ""
              echo "Please update the following README files manually:"
            } > comment.md

            IFS=',' read -ra DETAILS <<< "$CHANGES_DETAILS"
            for detail in "${DETAILS[@]}"; do
              chart=${detail%%:*}
              status=${detail##*:}
              if [[ "$status" == "needs_update" ]]; then
                echo "- ${chart}/README.md" >> comment.md
              fi
            done

            {
              echo ""
              echo "You can use the readme-generator tool to generate the updated README content:"
              echo ""
              echo '```bash'
              echo "npm install -g @bitnami/readme-generator-for-helm"
            } >> comment.md

            for detail in "${DETAILS[@]}"; do
              chart=${detail%%:*}
              status=${detail##*:}
              if [[ "$status" == "needs_update" ]]; then
                echo "readme-generator --values ${chart}/values.yaml --readme ${chart}/README.md" >> comment.md
              fi
            done

            echo '```' >> comment.md
          else
            {
              echo "## README Check Passed"
              echo ""
              echo "This PR is from a fork. The README generator has checked the README files and no changes are needed."
              echo ""
              echo "The following README files were checked:"
            } > comment.md

            IFS=' ' read -ra ADDR <<< "$MODIFIED_CHARTS"
            for chart in "${ADDR[@]}"; do
              echo "- ${chart}/README.md" >> comment.md
            done
          fi

      - name: Find existing README comment
        if: steps.results.outputs.should_comment == 'true'
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          comment-author: 'github-actions[bot]'
          body-regex: '^## README (Update Required|Check Passed)'

      - name: Create or update PR comment
        if: steps.results.outputs.should_comment == 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ steps.pr.outputs.number }}
          body-path: comment.md
          reactions: 'eyes'
          edit-mode: replace

      - name: Report status check
        if: steps.pr.outputs.found == 'true'
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          IS_FORK: ${{ steps.pr.outputs.is_fork }}
          HAS_CHANGES: ${{ steps.results.outputs.has_changes }}
          CHANGES_NEEDED: ${{ steps.results.outputs.changes_needed }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const head_sha = process.env.HEAD_SHA;

            let conclusion = 'success';
            let title = 'README Check Passed';
            let summary = 'No README updates needed.';

            if (process.env.HAS_CHANGES === 'true' && process.env.CHANGES_NEEDED === 'true') {
              if (process.env.IS_FORK === 'true') {
                conclusion = 'failure';
                title = 'README Update Required';
                summary = 'README updates are needed. Please see the PR comment for details.';
              } else {
                title = 'README Updated';
                summary = 'README files have been automatically updated.';
              }
            }

            await github.rest.checks.create({
              owner,
              repo,
              name: 'README Update Check',
              head_sha,
              status: 'completed',
              conclusion,
              output: { title, summary },
              details_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
            });

            core.info(`Reported ${conclusion} for ${head_sha}`);

      - name: Fail when a fork PR needs README updates
        if: steps.results.outputs.should_comment == 'true' && steps.results.outputs.changes_needed == 'true'
        run: |
          echo "README changes are needed. Please update the README files as instructed in the PR comment."
          exit 1
